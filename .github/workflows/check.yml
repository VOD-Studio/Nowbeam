name: Contract, Go and macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make setup
      - run: make check

  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/receiver/go.mod
          cache-dependency-path: services/receiver/go.sum
      - run: make test-receiver
      - run: make build-receiver

  macos:
    # 官方标准 macos-15 为 Apple Silicon；测试运行在最低支持系统上。
    # 工具链选用镜像内最新 Xcode：Swift 6.1.2 的 IRGen 存在 SmallVector 容量
    # 回绕崩溃（SettingsView 的 async thunk），且 Liquid Glass API 需要新 SDK；
    # 部署目标仍是 macOS 15，运行时降级路径在本 job 真实覆盖。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 选择最新 Xcode 工具链
        run: |
          test "$(uname -m)" = arm64
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用工具链: $LATEST"
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$LATEST/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$LATEST/Contents/Developer" swift --version
      - run: make setup
      - run: make test-macos
      - run: make test-macos SWIFT_CONFIGURATION=release
      - run: make app-debug
      - run: make app
