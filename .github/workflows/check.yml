name: Contract, Go and macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make setup
      - run: make check

  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/receiver/go.mod
          cache-dependency-path: services/receiver/go.sum
      - run: make test-receiver
      - run: make build-receiver

  macos:
    # macos-26（Apple Silicon）镜像含 Xcode 26.x。macos-15 镜像的最新
    # Xcode 16.4（Swift 6.1/6.2）在 IRGen 生成 async reabstraction thunk 时
    # SmallVector 容量回绕崩溃（signal 6），无法编译本包；Liquid Glass API
    # 也需要 macOS 26 SDK。部署目标仍为 macOS 15；macOS 15 真机运行属于
    # 独立验收项，不由 CI 代替。
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 选择最新 Xcode 工具链
        run: |
          test "$(uname -m)" = arm64
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用工具链: $LATEST"
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$LATEST/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$LATEST/Contents/Developer" swift --version
      - run: make setup
      - run: make test-macos
      - run: make test-macos SWIFT_CONFIGURATION=release
      - run: make app-debug
      - run: make app
